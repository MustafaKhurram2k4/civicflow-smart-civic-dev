version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: smart_civic_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=smart_civic_db
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./smart-civic-backend
      dockerfile: Dockerfile
    container_name: smart_civic_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=smart_civic_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-smart_civic_super_secret_jwt_key_2026}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./smart-civic-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    container_name: smart_civic_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
